<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Convert SVG to PNG</title>
</head>
<body style="background: white; text-align: center; padding: 20px;">
    <h2>Download Ikon Logo LBP</h2>
    
    <div id="svg-container" style="width: 512px; height: 512px; background: #ffffff; display: flex; align-items: center; justify-content: center; margin: 0 auto; border: 1px solid #ccc;">
        <svg id="my-svg" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" style="width: 90%; height: auto;">
            <g transform="skewX(-18)">
                <text x="180" y="360" font-family="'Arial Black', Impact, sans-serif" font-size="300" font-weight="900" fill="#FF7300">L</text>
                <text x="380" y="360" font-family="'Arial Black', Impact, sans-serif" font-size="300" font-weight="900" fill="#0C3068">B</text>
                <text x="610" y="360" font-family="'Arial Black', Impact, sans-serif" font-size="300" font-weight="900" fill="#0C3068">P</text>
            </g>
            <path d="M 265 360 C 480 320, 650 260, 800 220 L 790 200 L 890 190 L 810 260 L 805 240 C 650 285, 480 345, 265 360 Z" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" />
            <path d="M 265 360 C 480 320, 650 260, 800 220 L 790 200 L 890 190 L 810 260 L 805 240 C 650 285, 480 345, 265 360 Z" fill="#FF7300" />
        </svg>
    </div>

    <br><br>
    <button onclick="downloadPNG(192, 'icon-192.png')" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">Download icon-192.png</button>
    <button onclick="downloadPNG(512, 'icon-512.png')" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">Download icon-512.png</button>

    <script>
        function downloadPNG(size, filename) {
            const svgElement = document.getElementById('my-svg');
            const svgString = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const context = canvas.getContext('2d');
                
                // Latar belakang putih transparan/solid
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, size, size);
                
                // Gambar SVG ke canvas
                context.drawImage(image, 20, (size - (size * 0.45)) / 2, size - 40, size * 0.45);

                const png = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = png;
                downloadLink.download = filename;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };
            image.src = blobURL;
        }
    </script>
</body>
</html>
